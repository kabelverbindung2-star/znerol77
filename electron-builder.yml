appId: com.znerol.monitor
productName: ZnerolMonitor
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: kabelverbindung2-star
  repo: znerol77
  releaseType: release
