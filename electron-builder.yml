appId: com.znerol.monitor
productName: ZnerolMonitor
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # the desktop icon is (re)created on every install/update, so the app can always be opened from there
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ZnerolMonitor
  runAfterFinish: true
publish:
  provider: github
  owner: kabelverbindung2-star
  repo: znerol77
  releaseType: release
