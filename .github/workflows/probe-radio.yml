name: Radiosender prüfen
on:
  push:
    paths:
      - scripts/probe-radio.mjs
      - src/main/modules/radio-list.ts
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-radio.mjs
